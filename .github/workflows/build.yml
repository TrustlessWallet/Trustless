name: Reproducible release build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or branch to build (e.g., main 3.1.1)'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    # Execute natively inside the WS verification container
    container:
      image: reactnativecommunity/react-native-android@sha256:88d93a9282e0f54f84cec7b979da6c5e3f20d87f5be246b75c231838be852fec
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      # Install Node directly, avoiding apt-get freezes
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Execute reproducible build
        run: |
          git config --global --add safe.directory '*'
          bash reproducibility.sh

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        with:
          name: trustless-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk