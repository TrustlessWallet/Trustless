name: Reproducible release build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or branch to build (e.g., 2.0.3)'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    # Execute natively inside the WS verification container
    container:
      image: reactnativecommunity/react-native-android:latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      # Install Node directly, avoiding apt-get freezes
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Execute Reproducible Build
        run: bash reproducibility.sh

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        with:
          name: trustless-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk